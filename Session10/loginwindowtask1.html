<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="E:\Mern-Stack-Tasks\Session10\loginwindowtask1styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-form">
            <div class="avatar-container">
                <img src="LoginFormHumanImg.png" alt="User Avatar" class="avatar">
            </div>
            
            <h2 class="login-title">LOGIN WINDOW</h2>
            
            <form class="form">
                <div class="input-group">
                    <input type="email" class="form-input" placeholder="Your Email Address" required>
                </div>
                
                <div class="input-group">
                    <input type="password" class="form-input" placeholder="Your Password" required>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" class="checkbox">
                    <label for="terms" class="checkbox-label">
                        Agree With <span class="terms-link">Terms & Condition</span>
                    </label>
                </div>
                
                <button type="submit" class="login-button">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
