<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form with Bootstrap Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .input-group-text {
            background-color: #e9ecef;
            border-right: none;
            color: #6c757d;
        }
        
        .form-control {
            border-left: none;
        }
        
        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        
        .btn-send {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #000;
            font-weight: bold;
            padding: 0.75rem 2rem;
        }
        
        .btn-send:hover {
            background-color: #ffca2c;
            border-color: #ffc720;
            color: #000;
        }
        
        .invalid-feedback {
            display: none;
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        
        .was-validated .form-control:invalid ~ .invalid-feedback,
        .was-validated .form-select:invalid ~ .invalid-feedback {
            display: block;
        }
        
        .was-validated .form-control:invalid,
        .was-validated .form-select:invalid {
            border-color: #dc3545;
        }
        
        .radio-group {
            margin: 1rem 0;
        }
        
        .form-check {
            margin-right: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <form id="contactForm" class="needs-validation" novalidate>
                <!-- First Name -->
                <div class="mb-3">
                    <label for="firstName" class="form-label">First Name</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" class="form-control" id="firstName" name="firstName" placeholder="First Name" required>
                        <div class="invalid-feedback">
                            Please supply your first name
                        </div>
                    </div>
                </div>

                <!-- Last Name -->
                <div class="mb-3">
                    <label for="lastName" class="form-label">Last Name</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Last Name" required>
                        <div class="invalid-feedback">
                            Please supply your last name
                        </div>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">E-Mail</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="E-Mail Address" required>
                        <div class="invalid-feedback">
                            Please supply your email address
                        </div>
                    </div>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone #</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-phone"></i>
                        </span>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="(845)555-1212" required>
                        <div class="invalid-feedback">
                            Please supply your phone number
                        </div>
                    </div>
                </div>

                <!-- Address -->
                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-home"></i>
                        </span>
                        <input type="text" class="form-control" id="address" name="address" placeholder="Address" required>
                        <div class="invalid-feedback">
                            Please supply your street address
                        </div>
                    </div>
                </div>

                <!-- City -->
                <div class="mb-3">
                    <label for="city" class="form-label">City</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-home"></i>
                        </span>
                        <input type="text" class="form-control" id="city" name="city" placeholder="City" required>
                        <div class="invalid-feedback">
                            Please supply your city
                        </div>
                    </div>
                </div>

                <!-- State -->
                <div class="mb-3">
                    <label for="state" class="form-label">State</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-list"></i>
                        </span>
                        <select class="form-select" id="state" name="state" required>
                            <option value="">Please select your state</option>
                            <option value="CA">California</option>
                            <option value="NY">New York</option>
                            <option value="TX">Texas</option>
                            <option value="FL">Florida</option>
                            <option value="IL">Illinois</option>
                        </select>
                        <div class="invalid-feedback">
                            Please select your state
                        </div>
                    </div>
                </div>

                <!-- Hosting Radio Buttons -->
                <div class="mb-3">
                    <label class="form-label">Do you have hosting?</label>
                    <div class="radio-group">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="hosting" id="hostingYes" value="yes">
                            <label class="form-check-label" for="hostingYes">Yes</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="hosting" id="hostingNo" value="no">
                            <label class="form-check-label" for="hostingNo">No</label>
                        </div>
                    </div>
                </div>

                <!-- Project Description -->
                <div class="mb-3">
                    <label for="projectDescription" class="form-label">Project Description</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-edit"></i>
                        </span>
                        <textarea class="form-control" id="projectDescription" name="projectDescription" rows="4" placeholder="Project Description"></textarea>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="text-center">
                    <button type="submit" class="btn btn-send">
                        <i class="fas fa-paper-plane me-2"></i>Send
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Custom form validation
        (function() {
            'use strict';
            
            const form = document.getElementById('contactForm');
            
            form.addEventListener('submit', function(event) {
                event.preventDefault();
                event.stopPropagation();
                
                if (!form.checkValidity()) {
                    form.classList.add('was-validated');
                } else {
                    // Form is valid, you can submit data here
                    alert('Form submitted successfully!');
                    // Reset form if needed
                    // form.reset();
                    // form.classList.remove('was-validated');
                }
            });
            
            // Phone number formatting
            const phoneInput = document.getElementById('phone');
            phoneInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length >= 6) {
                    value = `(${value.slice(0, 3)})${value.slice(3, 6)}-${value.slice(6, 10)}`;
                } else if (value.length >= 3) {
                    value = `(${value.slice(0, 3)})${value.slice(3)}`;
                }
                e.target.value = value;
            });
            
        })();
    </script>
</body>
</html>
