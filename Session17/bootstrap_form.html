<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f0f0f0;
        }
        
        .form-container {
            max-width: 650px;
            margin: 50px auto;
            background-color: #f0f0f0;
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            text-align: right;
            padding-top: 7px;
        }
        
        .input-group-text {
            background-color: #e0e0e0;
            width: 40px;
            justify-content: center;
        }
        
        .form-control, .form-select {
            border-radius: 0 4px 4px 0;
        }
        
        .btn-send {
            background-color: #ff9800;
            border-color: #ff9800;
            color: white;
        }
        
        .btn-send:hover {
            background-color: #e68a00;
            border-color: #e68a00;
            color: white;
        }
        
        .error-message {
            color: #dc3545;
            font-size: 80%;
            margin-top: 0.25rem;
            display: none;
        }
        
        .error-icon {
            color: #dc3545;
            position: absolute;
            right: 10px;
            top: 12px;
            display: none;
            z-index: 5;
        }
        
        .form-select ~ .error-icon {
            right: 30px;
        }
        
        textarea ~ .error-icon {
            top: 12px;
        }
        
        .input-group.error .form-control,
        .input-group.error .form-select {
            border-color: #dc3545;
        }
        
        .input-group.error .error-message,
        .input-group.error .error-icon {
            display: block;
        }
        
        .radio-group.error .error-message {
            display: block;
        }
        
        .radio-group {
            padding-top: 7px;
        }
        
        @media (max-width: 768px) {
            .form-label {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container form-container">
        <form id="contactForm">
            <div class="row form-group">
                <label for="firstName" class="col-md-3 form-label">First Name</label>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="firstName" placeholder="First Name">
                        <span class="error-icon"><i class="fas fa-times"></i></span>
                    </div>
                    <div class="error-message">Please supply your first name</div>
                </div>
            </div>
            
            <div class="row form-group">
                <label for="lastName" class="col-md-3 form-label">Last Name</label>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="lastName" placeholder="Last Name">
                        <span class="error-icon"><i class="fas fa-times"></i></span>
                    </div>
                    <div class="error-message">Please supply your last name</div>
                </div>
            </div>
            
            <div class="row form-group">
                <label for="email" class="col-md-3 form-label">E-Mail</label>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="E-Mail Address">
                        <span class="error-icon"><i class="fas fa-times"></i></span>
                    </div>
                    <div class="error-message">Please supply your email address</div>
                </div>
            </div>
            
            <div class="row form-group">
                <label for="phone" class="col-md-3 form-label">Phone #</label>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                        <input type="tel" class="form-control" id="phone" value="(845)555-1212">
                        <span class="error-icon"><i class="fas fa-times"></i></span>
                    </div>
                    <div class="error-message">Please supply your phone number</div>
                </div>
            </div>
            
            <div class="row form-group">
                <label for="address" class="col-md-3 form-label">Address</label>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-home"></i></span>
                        <input type="text" class="form-control" id="address" placeholder="Address">
                        <span class="error-icon"><i class="fas fa-times"></i></span>
                    </div>
                    <div class="error-message">Please supply your street address</div>
                </div>
            </div>
            
            <div class="row form-group">
                <label for="city" class="col-md-3 form-label">City</label>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-home"></i></span>
                        <input type="text" class="form-control" id="city" placeholder="City">
                        <span class="error-icon"><i class="fas fa-times"></i></span>
                    </div>
                    <div class="error-message">Please supply your city</div>
                </div>
            </div>
            
            <div class="row form-group">
                <label for="state" class="col-md-3 form-label">State</label>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-list"></i></span>
                        <select class="form-select" id="state">
                            <option value="" selected>Please select your state</option>
                            <option value="AL">Alabama</option>
                            <option value="AK">Alaska</option>
                            <option value="AZ">Arizona</option>
                            <option value="AR">Arkansas</option>
                            <option value="CA">California</option>
                            <option value="CO">Colorado</option>
                            <option value="CT">Connecticut</option>
                            <option value="DE">Delaware</option>
                            <option value="FL">Florida</option>
                            <option value="GA">Georgia</option>
                            <option value="HI">Hawaii</option>
                            <option value="ID">Idaho</option>
                            <option value="IL">Illinois</option>
                            <option value="IN">Indiana</option>
                            <option value="IA">Iowa</option>
                            <option value="KS">Kansas</option>
                            <option value="KY">Kentucky</option>
                            <option value="LA">Louisiana</option>
                            <option value="ME">Maine</option>
                            <option value="MD">Maryland</option>
                            <option value="MA">Massachusetts</option>
                            <option value="MI">Michigan</option>
                            <option value="MN">Minnesota</option>
                            <option value="MS">Mississippi</option>
                            <option value="MO">Missouri</option>
                            <option value="MT">Montana</option>
                            <option value="NE">Nebraska</option>
                            <option value="NV">Nevada</option>
                            <option value="NH">New Hampshire</option>
                            <option value="NJ">New Jersey</option>
                            <option value="NM">New Mexico</option>
                            <option value="NY">New York</option>
                            <option value="NC">North Carolina</option>
                            <option value="ND">North Dakota</option>
                            <option value="OH">Ohio</option>
                            <option value="OK">Oklahoma</option>
                            <option value="OR">Oregon</option>
                            <option value="PA">Pennsylvania</option>
                            <option value="RI">Rhode Island</option>
                            <option value="SC">South Carolina</option>
                            <option value="SD">South Dakota</option>
                            <option value="TN">Tennessee</option>
                            <option value="TX">Texas</option>
                            <option value="UT">Utah</option>
                            <option value="VT">Vermont</option>
                            <option value="VA">Virginia</option>
                            <option value="WA">Washington</option>
                            <option value="WV">West Virginia</option>
                            <option value="WI">Wisconsin</option>
                            <option value="WY">Wyoming</option>
                        </select>
                        <span class="error-icon"><i class="fas fa-times"></i></span>
                    </div>
                    <div class="error-message">Please select your state</div>
                </div>
            </div>
            
            <div class="row form-group">
                <label class="col-md-3 form-label">Do you have hosting?</label>
                <div class="col-md-9">
                    <div class="radio-group">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="hosting" id="hostingYes" value="Yes">
                            <label class="form-check-label" for="hostingYes">Yes</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="hosting" id="hostingNo" value="No">
                            <label class="form-check-label" for="hostingNo">No</label>
                        </div>
                        <div class="error-message">Please select if you have hosting</div>
                    </div>
                </div>
            </div>
            
            <div class="row form-group">
                <label for="projectDescription" class="col-md-3 form-label">Project Description</label>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-pencil-alt"></i></span>
                        <textarea class="form-control" id="projectDescription" rows="3" placeholder="Project Description"></textarea>
                        <span class="error-icon"><i class="fas fa-times"></i></span>
                    </div>
                    <div class="error-message">Please provide a project description</div>
                </div>
            </div>
            
            <div class="row form-group">
                <div class="col-md-9 offset-md-3">
                    <button type="submit" class="btn btn-send" id="sendButton">
                        Send <i class="fas fa-paper-plane ms-2"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            let isValid = true;
            
            // Validate First Name
            const firstName = document.getElementById('firstName');
            if (!firstName.value.trim()) {
                isValid = false;
                firstName.closest('.input-group').classList.add('error');
            } else {
                firstName.closest('.input-group').classList.remove('error');
            }
            
            // Validate Last Name
            const lastName = document.getElementById('lastName');
            if (!lastName.value.trim()) {
                isValid = false;
                lastName.closest('.input-group').classList.add('error');
            } else {
                lastName.closest('.input-group').classList.remove('error');
            }
            
            // Validate Email
            const email = document.getElementById('email');
            if (!email.value.trim() || !isValidEmail(email.value)) {
                isValid = false;
                email.closest('.input-group').classList.add('error');
            } else {
                email.closest('.input-group').classList.remove('error');
            }
            
            // Validate Phone
            const phone = document.getElementById('phone');
            if (!phone.value.trim()) {
                isValid = false;
                phone.closest('.input-group').classList.add('error');
            } else {
                phone.closest('.input-group').classList.remove('error');
            }
            
            // Validate Address
            const address = document.getElementById('address');
            if (!address.value.trim()) {
                isValid = false;
                address.closest('.input-group').classList.add('error');
            } else {
                address.closest('.input-group').classList.remove('error');
            }
            
            // Validate City
            const city = document.getElementById('city');
            if (!city.value.trim()) {
                isValid = false;
                city.closest('.input-group').classList.add('error');
            } else {
                city.closest('.input-group').classList.remove('error');
            }
            
            // Validate State
            const state = document.getElementById('state');
            if (!state.value) {
                isValid = false;
                state.closest('.input-group').classList.add('error');
            } else {
                state.closest('.input-group').classList.remove('error');
            }
            
            // Validate Hosting
            const hostingYes = document.getElementById('hostingYes');
            const hostingNo = document.getElementById('hostingNo');
            if (!hostingYes.checked && !hostingNo.checked) {
                isValid = false;
                document.querySelector('.radio-group').classList.add('error');
            } else {
                document.querySelector('.radio-group').classList.remove('error');
            }
            
            // Validate Project Description
            const projectDescription = document.getElementById('projectDescription');
            if (!projectDescription.value.trim()) {
                isValid = false;
                projectDescription.closest('.input-group').classList.add('error');
            } else {
                projectDescription.closest('.input-group').classList.remove('error');
            }
            
            if (isValid) {
                console.log('Form is valid, submitting...');
                // this.submit();
            }
        });
        
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
    </script>
</body>
</html>
