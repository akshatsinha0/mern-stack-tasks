<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .password-generator {
            background: #1e3a3a;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            color: white;
        }

        .title {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            text-align: center;
            padding: 15px;
            border-radius: 25px;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .password-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .password-display {
            flex: 1;
            background: transparent;
            border: none;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            color: #333;
            outline: none;
            letter-spacing: 1px;
        }

        .password-label {
            color: #333;
            font-weight: 600;
            font-size: 16px;
        }

        .copy-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .copy-btn:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .length-control {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .length-label {
            font-size: 16px;
            font-weight: 600;
            color: white;
            min-width: 80px;
        }

        .length-slider {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .length-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #4CAF50;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .length-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #4CAF50;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .options {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            accent-color: #4CAF50;
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 16px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .strength-indicator {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .strength-weak {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        .strength-medium {
            background: rgba(255, 152, 0, 0.2);
            color: #ff9800;
        }

        .strength-strong {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        @media (max-width: 480px) {
            .password-generator {
                padding: 20px;
            }

            .controls {
                flex-direction: column;
                gap: 20px;
                align-items: stretch;
            }

            .options {
                justify-content: space-around;
            }

            .title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="password-generator">
        <div class="title">Password - Generator</div>
        
        <div class="password-container">
            <span class="password-label">Password</span>
            <input type="text" class="password-display" id="passwordDisplay" readonly title="Generated password" placeholder="Your password will appear here">
            <button class="copy-btn" id="copyBtn">Copy</button>
        </div>

        <div class="controls">
            <div class="length-control">
                <label class="length-label" id="lengthLabel">Length 23</label>
                <input type="range" class="length-slider" id="lengthSlider" min="4" max="50" value="23" title="Password length">
            </div>
        </div>

        <div class="options">
            <div class="checkbox-group">
                <input type="checkbox" class="checkbox" id="includeCharacters" checked>
                <label class="checkbox-label" for="includeCharacters">Characters</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" class="checkbox" id="includeNumbers" checked>
                <label class="checkbox-label" for="includeNumbers">Numbers</label>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn">Generate Password</button>
        
        <div class="strength-indicator" id="strengthIndicator" style="display: none;"></div>
    </div>

    <script>
        'use strict';

        class AdvancedPasswordGenerator {
            constructor() {
                this.initializeElements();
                this.bindEvents();
                this.generatePassword();
            }

            initializeElements() {
                this.elements = {
                    passwordDisplay: document.getElementById('passwordDisplay'),
                    copyBtn: document.getElementById('copyBtn'),
                    lengthSlider: document.getElementById('lengthSlider'),
                    lengthLabel: document.getElementById('lengthLabel'),
                    includeCharacters: document.getElementById('includeCharacters'),
                    includeNumbers: document.getElementById('includeNumbers'),
                    generateBtn: document.getElementById('generateBtn'),
                    strengthIndicator: document.getElementById('strengthIndicator')
                };

                this.characterSets = {
                    lowercase: 'abcdefghijklmnopqrstuvwxyz',
                    uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                    numbers: '0123456789',
                    symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
                };
            }

            bindEvents() {
                this.elements.generateBtn.addEventListener('click', () => this.generatePassword());
                this.elements.copyBtn.addEventListener('click', () => this.copyToClipboard());
                this.elements.lengthSlider.addEventListener('input', () => this.updateLengthLabel());
                this.elements.lengthSlider.addEventListener('input', () => this.generatePassword());
                this.elements.includeCharacters.addEventListener('change', () => this.generatePassword());
                this.elements.includeNumbers.addEventListener('change', () => this.generatePassword());
            }

            updateLengthLabel() {
                const length = this.elements.lengthSlider.value;
                this.elements.lengthLabel.textContent = `Length ${length}`;
                this.updateSliderProgress();
            }

            updateSliderProgress() {
                const slider = this.elements.lengthSlider;
                const progress = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
                slider.style.background = `linear-gradient(90deg, #4CAF50 ${progress}%, rgba(255, 255, 255, 0.3) ${progress}%)`;
            }

            generatePassword() {
                const length = parseInt(this.elements.lengthSlider.value);
                let charset = '';

                // Build character set based on selected options
                if (this.elements.includeCharacters.checked) {
                    charset += this.characterSets.lowercase + this.characterSets.uppercase + this.characterSets.symbols;
                }
                if (this.elements.includeNumbers.checked) {
                    charset += this.characterSets.numbers;
                }

                if (!charset) {
                    this.elements.passwordDisplay.value = 'Select at least one option';
                    return;
                }

                let password = '';
                
                // Ensure at least one character from each selected set
                if (this.elements.includeCharacters.checked) {
                    password += this.getRandomChar(this.characterSets.lowercase);
                    password += this.getRandomChar(this.characterSets.uppercase);
                    password += this.getRandomChar(this.characterSets.symbols);
                }
                if (this.elements.includeNumbers.checked) {
                    password += this.getRandomChar(this.characterSets.numbers);
                }

                // Fill remaining length with random characters
                for (let i = password.length; i < length; i++) {
                    password += this.getRandomChar(charset);
                }

                // Shuffle the password to randomize character positions
                password = this.shuffleString(password);

                this.elements.passwordDisplay.value = password;
                this.assessPasswordStrength(password);
                this.updateLengthLabel();
            }

            getRandomChar(charset) {
                const randomIndex = Math.floor(Math.random() * charset.length);
                return charset[randomIndex];
            }

            shuffleString(str) {
                return str.split('').sort(() => Math.random() - 0.5).join('');
            }

            assessPasswordStrength(password) {
                const indicator = this.elements.strengthIndicator;
                let score = 0;

                // Length scoring
                if (password.length >= 12) score += 2;
                else if (password.length >= 8) score += 1;

                // Character variety scoring
                if (/[a-z]/.test(password)) score += 1;
                if (/[A-Z]/.test(password)) score += 1;
                if (/[0-9]/.test(password)) score += 1;
                if (/[^A-Za-z0-9]/.test(password)) score += 1;

                // Display strength
                indicator.style.display = 'block';
                if (score <= 2) {
                    indicator.className = 'strength-indicator strength-weak';
                    indicator.textContent = 'Weak Password';
                } else if (score <= 4) {
                    indicator.className = 'strength-indicator strength-medium';
                    indicator.textContent = 'Medium Password';
                } else {
                    indicator.className = 'strength-indicator strength-strong';
                    indicator.textContent = 'Strong Password';
                }
            }

            async copyToClipboard() {
                const password = this.elements.passwordDisplay.value;
                
                if (!password || password === 'Select at least one option') {
                    this.showCopyFeedback('Nothing to copy', false);
                    return;
                }

                try {
                    await navigator.clipboard.writeText(password);
                    this.showCopyFeedback('Copied!', true);
                } catch (error) {
                    // Fallback for older browsers
                    this.elements.passwordDisplay.select();
                    document.execCommand('copy');
                    this.showCopyFeedback('Copied!', true);
                }
            }

            showCopyFeedback(message, success) {
                const originalText = this.elements.copyBtn.textContent;
                this.elements.copyBtn.textContent = message;
                this.elements.copyBtn.style.background = success ? '#4CAF50' : '#f44336';

                setTimeout(() => {
                    this.elements.copyBtn.textContent = originalText;
                    this.elements.copyBtn.style.background = '#4CAF50';
                }, 1500);
            }
        }

        // Initialize the password generator when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            window.passwordGenerator = new AdvancedPasswordGenerator();
        });

        // Initialize slider progress on load
        window.addEventListener('load', () => {
            if (window.passwordGenerator) {
                window.passwordGenerator.updateSliderProgress();
            }
        });
    </script>
</body>
</html>
