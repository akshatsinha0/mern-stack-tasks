<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Task</title>
    <style>
        .list-container {
            border: 2px solid #ccc;
            padding: 20px;
            width: 300px;
            margin: 20px;
            border-radius: 5px;
        }
        
        ul {
            margin: 0;
            padding-left: 20px;
        }
        
        li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="list-container">
        <p><strong>Lists can be nested (list inside list):</strong></p>
        <ul>
            <li>Coffee</li>
            <li>Tea
                <ul>
                    <li>Black tea</li>
                    <li>Green tea</li>
                </ul>
            </li>
            <li>Milk</li>
        </ul>
    </div>
</body>
</html>
