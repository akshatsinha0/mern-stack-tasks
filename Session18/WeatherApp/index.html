<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Open-Meteo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="weather-card">
            <div class="header">
                <h1 class="app-title">Weather App</h1>
                <div class="search-container">
                    <input type="text" id="locationInput" placeholder="Enter city name (e.g., Allahabad)" class="search-input">
                    <button id="searchBtn" class="search-button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="loader"></div>
                <p>Fetching weather data...</p>
            </div>

            <div class="weather-content" id="weatherContent">
                <div class="current-weather">
                    <div class="temperature-section">
                        <div class="main-temp" id="temperature">20°</div>
                        <div class="location-info">
                            <div class="city" id="cityName">Bhopal</div>
                            <div class="date-time">
                                <span id="currentTime">12:15 Monday</span>
                            </div>
                        </div>
                    </div>
                    <div class="weather-icon">
                        <i id="weatherIcon" class="fas fa-cloud"></i>
                    </div>
                </div>

                <div class="weather-condition">
                    <span id="weatherDescription">mist</span>
                </div>

                <div class="weather-details">
                    <div class="detail-item">
                        <i class="fas fa-eye"></i>
                        <div class="detail-info">
                            <span class="detail-label">Visibility</span>
                            <span class="detail-value" id="visibility">10 km</span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-tint"></i>
                        <div class="detail-info">
                            <span class="detail-label">Humidity</span>
                            <span class="detail-value" id="humidity">65%</span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-wind"></i>
                        <div class="detail-info">
                            <span class="detail-label">Wind Speed</span>
                            <span class="detail-value" id="windSpeed">15 km/h</span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-thermometer-half"></i>
                        <div class="detail-info">
                            <span class="detail-label">Feels Like</span>
                            <span class="detail-value" id="feelsLike">22°</span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-gauge-high"></i>
                        <div class="detail-info">
                            <span class="detail-label">Pressure</span>
                            <span class="detail-value" id="pressure">1013 hPa</span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-sun"></i>
                        <div class="detail-info">
                            <span class="detail-label">UV Index</span>
                            <span class="detail-value" id="uvIndex">3</span>
                        </div>
                    </div>
                </div>

                <div class="hourly-forecast" id="hourlyForecast">
                    <h3>24-Hour Forecast</h3>
                    <div class="hourly-container">
                        <!-- Hourly items will be dynamically generated -->
                    </div>
                </div>
            </div>

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-triangle"></i>
                <p>Unable to fetch weather data. Please try again.</p>
            </div>
        </div>
    </div>

    <script src="E:\Mern-Stack-Tasks\Session18\WeatherApp\script.js"></script>
</body>
</html>
