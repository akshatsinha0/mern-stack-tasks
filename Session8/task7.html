<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    .navbar {
      display: flex;
      background-color: black;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      border-bottom: 5px solid orange;
      justify-content: center;
    }

    .navbar a {
      padding: 15px 25px;
      text-decoration: none;
      color: white;
      font-size: 22px;
      border-right: 1px solid white;
      text-align: center;
    }

    .navbar a:last-child {
      border-right: none;
    }

    .navbar a:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Product</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
    <a href="#">Users</a>
    <a href="#">Login</a>
  </div>

</body>
</html>
