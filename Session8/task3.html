<!DOCTYPE html>
<html>
<head>
  <style>
    ul.star-list {
      list-style: none;
      padding: 0;
    }
    ul.star-list li::before {
      content: '★';
      color: red;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <ul class="star-list">
    <li>Hummus</li>
    <li>Pita</li>
    <li>Green salad</li>
    <li>Halloumi</li>
  </ul>
</body>
</html>
