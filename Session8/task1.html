<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Task Demo</title>
  <style>
    .justified-text {
      text-align: justify;
      font: italic small-caps bold 16px/1.5 Arial, sans-serif; /* All font properties */
    }

    .shadow-text {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      font: normal 18px Georgia, serif; /* Font shorthand */
    }
  </style>
</head>
<body>

  <h2 class="shadow-text">This heading has text shadow</h2>

  <p class="justified-text">
    This paragraph uses the <strong>justify</strong> property to align text evenly on both sides. It also applies all font properties using the shorthand <code>font</code> declaration.
  </p>

</body>
</html>
